<text x="855.0" y="90" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client Service</text>
<text x="855.0" y="109" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">open-source 360°</text>
<text x="855.0" y="126" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">viewer, no license</text>
