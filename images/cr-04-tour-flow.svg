<text x="135.0" y="90" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">360° camera</text>
<text x="135.0" y="109" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">Insta360 X5, owned</text>
<text x="135.0" y="126" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">by the company</text>
