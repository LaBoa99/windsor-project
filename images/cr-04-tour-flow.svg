<text x="135.0" y="280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Phone</text>
<text x="135.0" y="299" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">drag or move the phone;</text>
<text x="135.0" y="316" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">light tiles load first</text>
<rect x="270" y="260" width="210" height="85" rx="6" fill="#e3ecf7" stroke="#1f5fad" stroke-width="1.4"/>
<rect x="438" y="253" width="35" height="14" rx="3" fill="#1f5fad"/>
<text x="455.5" y="263.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">CR-04</text>
<text x="375.0" y="280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Computer</text>
<text x="375.0" y="299" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">drag with the mouse;</text>
<text x="375.0" y="316" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">zoom loads detail</text>
<rect x="510" y="260" width="210" height="85" rx="6" fill="#e3ecf7" stroke="#1f5fad" stroke-width="1.4"/>
<rect x="678" y="253" width="35" height="14" rx="3" fill="#1f5fad"/>
<text x="695.5" y="263.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">CR-04</text>
<text x="615.0" y="280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">VR headset (optional)</text>
<text x="615.0" y="299" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">same viewer, immersive</text>
<text x="615.0" y="316" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">mode if detected</text>
